<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="600" height="338" rx="22" fill="#8b7cf6"/>
<text x="36" y="48" font-size="13" letter-spacing="3" font-weight="700" fill="#0f1117" opacity="0.75">02</text>
<text x="36" y="106" font-size="40" font-weight="800" fill="#0f1117">Plasma physics</text>
<text x="36" y="142.5" font-size="18.5" font-weight="500" fill="#0f1117">icfsim, a verification-first radiation-hydrodynamics code</text>
<text x="36" y="169.3" font-size="18.5" font-weight="500" fill="#0f1117">for inertial confinement fusion, growing toward an</text>
<text x="36" y="196.1" font-size="18.5" font-weight="500" fill="#0f1117">integrated direct-drive implosion validated against OMEGA</text>
<text x="36" y="223.0" font-size="18.5" font-weight="500" fill="#0f1117">data. Also a relativistic two-fluid + Maxwell solver for</text>
<text x="36" y="249.8" font-size="18.5" font-weight="500" fill="#0f1117">SRS, SBS and TPD, and coupled-mode and Vlasov models for</text>
<text x="36" y="276.6" font-size="18.5" font-weight="500" fill="#0f1117">growth rates, Landau damping and particle trapping.</text>
</svg>