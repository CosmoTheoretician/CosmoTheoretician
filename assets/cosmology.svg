<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="600" height="338" rx="22" fill="#1a1d24"/>
<text x="36" y="48" font-size="13" letter-spacing="3" font-weight="700" fill="#f5f5f7" opacity="0.75">03</text>
<text x="36" y="106" font-size="40" font-weight="800" fill="#f5f5f7">Cosmology</text>
<text x="36" y="141.5" font-size="17.5" font-weight="500" fill="#f5f5f7">skua, a test rig for cosmological expansion histories:</text>
<text x="36" y="166.9" font-size="17.5" font-weight="500" fill="#f5f5f7">validated against DESI DR2, Planck and three supernova</text>
<text x="36" y="192.2" font-size="17.5" font-weight="500" fill="#f5f5f7">catalogues, and used to reproduce and calibrate the evidence</text>
<text x="36" y="217.6" font-size="17.5" font-weight="500" fill="#f5f5f7">for evolving dark energy. (Its predecessor refuted the Janus</text>
<text x="36" y="243.0" font-size="17.5" font-weight="500" fill="#f5f5f7">twin-matter cosmology: DESI DR2 BAO and two supernova</text>
<text x="36" y="268.4" font-size="17.5" font-weight="500" fill="#f5f5f7">samples reject it at Δχ² ≈ 317 against ΛCDM.)</text>
</svg>